[project]
name = "forma-backend"
version = "0.1.0"
description = "Forma: text/image -> 3D model -> print-ready mesh (FastAPI backend)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "numpy>=1.26",
    "scipy>=1.12",
    "trimesh>=4.4",
    "manifold3d>=3.0",
    "fast-simplification>=0.1.7",
    "scikit-image>=0.22",
    "networkx>=3.2",
    "lxml>=5.0",
    "pillow>=10.0",
    "gradio_client>=1.3",
    "huggingface_hub>=0.25",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Extra repair filters (needs libOpenGL on Linux: apt install libopengl0).
meshlab = ["pymeshlab>=2023.12"]
# Local CUDA inference (Linux + NVIDIA GPU). TRELLIS.2 / Hunyuan3D need their
# own CUDA extensions; see README "Linux con GPU".
gpu = [
    "torch>=2.4",
    "torchvision>=0.19",
    "diffusers>=0.31",
    "transformers>=4.45",
    "accelerate>=0.34",
    "sentencepiece>=0.2",
    "rembg>=2.0.57",
]
# Idol (speridlabs/idol, Apache-2.0) on this machine's NVIDIA GPU, Windows included: one image
# to 3D Gaussians, then a solid mesh (providers/idol.py). ~7 GB of VRAM. `make install-idol`.
idol = [
    "idol",
    "torch>=2.5",
    "torchvision>=0.20",
    "transformers>=4.56",
    "diffusers>=0.36",
    "tensordict>=0.8",
    "plyfile>=1.0",
    "safetensors>=0.4",
]

[tool.uv.sources]
idol = { git = "https://github.com/speridlabs/idol-sdk", rev = "4702a7f00850e34b6e83a2170cc123c3e9570744" }
# On Windows PyPI only has CPU builds of PyTorch: the CUDA ones come from PyTorch's own index
# (CUDA 13.2, any recent NVIDIA driver). Linux (CUDA builds on PyPI) and macOS keep PyPI.
torch = [{ index = "pytorch-cu132", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu132", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
