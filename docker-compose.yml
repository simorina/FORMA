# Forma con Docker.
#   docker compose up --build                              CPU (hf_remote / procedural) -> http://localhost:8000
#   docker compose --profile gpu up --build forma-gpu      GPU NVIDIA (local)          -> http://localhost:8001
# Le impostazioni vengono da .env (facoltativo: copialo da .env.example). I modelli restano nel volume forma-data.
name: forma

services:
  forma:
    build:
      context: .
      dockerfile: Dockerfile
    image: forma:cpu
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
    volumes:
      - forma-data:/data
    restart: unless-stopped

  forma-gpu:
    profiles: [gpu]
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: forma:gpu
    ports:
      - "8001:8000"
    env_file:
      - path: .env
        required: false
    environment:
      GEN_PROVIDER: local
      DATA_DIR: /data
      HF_HOME: /data/huggingface
    volumes:
      - forma-data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  forma-data:
